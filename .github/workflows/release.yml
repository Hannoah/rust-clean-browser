name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Package installer + portable zip
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\rust-clean-browser.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $files = @("target\release\rust-browser.exe", "LICENSE", "README.md") + (Get-ChildItem target\release\*.dll | ForEach-Object FullName)
          Compress-Archive -Path $files -DestinationPath "dist\RustCleanBrowser-$v-windows-x64-portable.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build app bundle + DMG
        run: |
          bash scripts/macos-bundle.sh
          V="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p dmg && cp -R "dist/Rust Clean Browser.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Rust Clean Browser" -srcfolder dmg -ov -format UDZO "dist/RustCleanBrowser-$V-macos-arm64.dmg"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: Rust Clean Browser ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*
